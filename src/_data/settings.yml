  # Blank lines between paragraphs start a new paragraph on the page.
  story_text: |
    Andrew and Blue met so serendipitously that it almost sounds like they made it up — both of them got lost trying to find the room to their class on the first day of university.

    As their friendship grew over the year that followed, Andrew realized that he could not let someone as extraordinary go and finally built up the courage to ask Blue out after a screening of the Bee Movie.

    Through a pandemic, five degrees, five moves, seven jobs, and countless getaways around the world, their relationship will culminate on their wedding on May 8, 2027. We hope to see you there!

  schedule_eyebrow: "May 8–9, 2027"

