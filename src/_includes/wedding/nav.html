<!-- ════ NAV ════ -->
{% assign home = site.baseurl | append: "/" %}
<nav id="mainNav">
  <div class="nav-top">
    <a href="{{ home }}" class="nav-monogram">{{ site.data.couple.spouse1.short_name }} &amp; {{ site.data.couple.spouse2.short_name }}</a>
    <button class="nav-hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-bottom">
    <ul class="nav-links">
      {% for item in site.data.wedding_nav %}
      <li><a href="{{ home }}#{{ item.anchor }}" data-section="{{ item.anchor }}">{{ item.label }}</a></li>
      {% endfor %}
    </ul>
    <a href="{{ site.baseurl }}/rsvp/" class="nav-rsvp">RSVP</a>
  </div>
</nav>
<div class="nav-drawer" id="navDrawer">
  {% for item in site.data.wedding_nav %}
  <a href="{{ home }}#{{ item.anchor }}" onclick="closeDrawer()">{{ item.label }}</a>
  {% endfor %}
  <a href="{{ site.baseurl }}/rsvp/" class="rsvp-mobile">RSVP</a>
</div>
