<script>
/* remembered RSVP (this device only) */
const RSVP_KEY='ab_rsvp';
function getRsvp(){try{return JSON.parse(localStorage.getItem(RSVP_KEY));}catch(e){return null;}}
function setRsvp(v){try{localStorage.setItem(RSVP_KEY,JSON.stringify(v));}catch(e){}}

/* countdown */
(function(){
  const d=document.getElementById('cd-days');
  if(!d)return;
  const h=document.getElementById('cd-hours'),m=document.getElementById('cd-mins'),s=document.getElementById('cd-secs');
  const w=new Date('{{ site.data.settings.wedding.countdown_target }}');
  const pad=n=>String(n).padStart(2,'0');
  function tick(){
    const t=Math.max(0,w-new Date());
    d.textContent=Math.floor(t/86400000);
    h.textContent=pad(Math.floor(t%86400000/3600000));
    m.textContent=pad(Math.floor(t%3600000/60000));
    s.textContent=pad(Math.floor(t%60000/1000));
  }
  tick();setInterval(tick,1000);
})();

/* hero RSVP button reflects a previous reply */
(function(){
  const btn=document.getElementById('heroRsvp'),note=document.getElementById('heroRsvpNote');
  if(!btn||!getRsvp())return;
  btn.textContent='Update your RSVP';
  note.textContent='Thank you for replying! We have your RSVP.';
})();

/* nav */
const sections=[{% for item in site.data.wedding_nav %}'{{ item.anchor }}'{% unless forloop.last %},{% endunless %}{% endfor %}];
function highlightNav(){
  const y=window.scrollY+120;let a='';
  sections.forEach(id=>{const el=document.getElementById(id);if(el&&el.offsetTop<=y)a=id;});
  document.querySelectorAll('.nav-links a[data-section]').forEach(a2=>{a2.classList.toggle('active',a2.dataset.section===a);});
}
window.addEventListener('scroll',()=>{
  document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>40);
  highlightNav();
});
const ham=document.getElementById('hamburger'),drw=document.getElementById('navDrawer');
ham.addEventListener('click',()=>{ham.classList.toggle('open');drw.classList.toggle('open');});
function closeDrawer(){ham.classList.remove('open');drw.classList.remove('open');}

/* reveal */
const ro=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');});},{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>ro.observe(el));

/* rsvp: conditional fields + remembered state */
(function(){
  const form=document.getElementById('rsvpForm');
  if(!form)return;
  const att=document.getElementById('rsvpAttending'),po=document.getElementById('rsvpPlusOne');
  const yes=form.querySelector('.rsvp-when-yes'),guest=form.querySelector('.rsvp-when-guest');
  function sync(){
    const declining=att.value==='no',accepting=att.value==='yes';
    yes.hidden=declining;
    guest.hidden=declining||po.value!=='yes';
    yes.querySelectorAll('[data-req]').forEach(el=>{
      el.required=accepting&&!(guest.contains(el)&&guest.hidden);
    });
  }
  sync();
  att.addEventListener('change',sync);po.addEventListener('change',sync);

  const done=document.getElementById('rsvpDone'),success=document.getElementById('rsvpSuccess');
  const prev=getRsvp();
  if(prev){
    form.style.display='none';done.hidden=false;
    if(prev.name)document.getElementById('rsvpDoneName').textContent=', '+prev.name;
  }
  document.getElementById('rsvpEdit').addEventListener('click',()=>{done.hidden=true;success.style.display='none';form.style.display='';});
  const FORM_ACTION="{{ site.data.settings.wedding.rsvp_form.form_action }}";
  const ENTRY={ {% for e in site.data.settings.wedding.rsvp_form.entries %}"{{ e[0] }}":"{{ e[1] }}"{% unless forloop.last %},{% endunless %}{% endfor %} };
  const LABEL={attending:{yes:'Joyfully accepts',no:'Regretfully declines'},plus_one:{yes:'Me + one guest',no:'Just me'}};
  /* playful double-check before a decline is sent */
  const confirmBox=document.getElementById('rsvpConfirm'),cTitle=document.getElementById('rsvpConfirmTitle'),
        cSub=document.getElementById('rsvpConfirmSub'),cYes=document.getElementById('rsvpComeAfterAll'),
        cNo=document.getElementById('rsvpStillNo');
  const STEPS=[
    {title:'Are you sure?',sub:'There will be cake. And dancing. And us.',yes:'Wait, I’ll come!',no:'Yes, I’m sure'},
    {title:'Are you doubly sure?',sub:'Like, really really sure?',yes:'Okay fine, I’ll come!',no:'Doubly sure'}
  ];
  let step=0;
  function showStep(){
    const s=STEPS[step];cTitle.textContent=s.title;cSub.textContent=s.sub;cYes.textContent=s.yes;cNo.textContent=s.no;
  }
  cYes.addEventListener('click',()=>{
    confirmBox.hidden=true;form.style.display='';
    att.value='yes';sync();
    const meal=form.querySelector('[name="meal"]');if(meal)meal.focus();
  });
  cNo.addEventListener('click',()=>{
    if(++step<STEPS.length){showStep();return;}
    confirmBox.hidden=true;send(true);
  });
  window.submitRSVP=function(e){
    e.preventDefault();
    if(att.value==='no'){
      step=0;showStep();form.style.display='none';success.style.display='none';confirmBox.hidden=false;
      return;
    }
    send(false);
  };
  function send(declining){
    const btn=form.querySelector('.rsvp-submit'),noGuest=declining||po.value!=='yes';
    const body=new URLSearchParams();
    Object.keys(ENTRY).forEach(k=>{
      if(!ENTRY[k]||!form[k])return;
      let v=(form[k].value||'').trim();
      if(declining&&['meal','brunch','plus_one'].includes(k))v='';
      if(noGuest&&['guest_name','guest_meal'].includes(k))v='';
      if(LABEL[k]&&LABEL[k][v])v=LABEL[k][v];
      body.append('entry.'+ENTRY[k],v);
    });
    function finish(){
      setRsvp({name:form.first_name.value.trim(),at:new Date().toISOString()});
      success.innerHTML=declining?'Okay, <br>we’ll miss you!':'Thank you! <br>We’ll see you there!';
      form.style.display='none';success.style.display='block';
      btn.disabled=false;btn.textContent='Send RSVP';
    }
    if(!FORM_ACTION){finish();return;}
    btn.disabled=true;btn.textContent='Sending…';
    fetch(FORM_ACTION,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body})
      .then(finish)
      .catch(()=>{form.style.display='';btn.disabled=false;btn.textContent='Send RSVP';alert('Something went wrong sending your RSVP. Please check your connection and try again.');});
  }
})();

/* wedding party shuffle */
(function(){
  const grid=document.querySelector('.party-grid');
  if(!grid)return;
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  }
  const mohs=[...grid.querySelectorAll('[data-party="moh"]')];
  const bridesmaids=[...grid.querySelectorAll('[data-party="bridesmaid"]')];
  const bestMan=grid.querySelector('[data-party="best-man"]');
  const groomsmen=[...grid.querySelectorAll('[data-party="groomsman"]')];
  const dividers=[...grid.querySelectorAll('.party-divider')];
  shuffle(mohs);shuffle(bridesmaids);shuffle(groomsmen);
  [dividers[0],...mohs,...bridesmaids,dividers[1],bestMan,...groomsmen].forEach(el=>el&&grid.appendChild(el));
})();

/* slideshow */
(function(){
  const wrapper=document.querySelector('.slideshow-wrapper');
  if(!wrapper)return;
  const slides=document.querySelectorAll('.slide');
  const dots=document.querySelectorAll('.ss-dot');
  let cur=0,timer;
  function goTo(n){
    slides[cur].classList.remove('active');dots[cur].classList.remove('active');
    cur=(n+slides.length)%slides.length;
    slides[cur].classList.add('active');dots[cur].classList.add('active');
  }
  function startAuto(){timer=setInterval(()=>goTo(cur+1),4000);}
  function resetAuto(){clearInterval(timer);startAuto();}
  document.getElementById('ss-prev').addEventListener('click',()=>{goTo(cur-1);resetAuto();});
  document.getElementById('ss-next').addEventListener('click',()=>{goTo(cur+1);resetAuto();});
  dots.forEach(d=>d.addEventListener('click',()=>{goTo(+d.dataset.slide);resetAuto();}));
  wrapper.addEventListener('mouseenter',()=>clearInterval(timer));
  wrapper.addEventListener('mouseleave',startAuto);
  startAuto();
})();
/* gallery filter + lightbox */
(function(){
  const grid=document.querySelector('.gallery-grid');
  if(!grid)return;
  const items=[...grid.querySelectorAll('.gallery-item')];
  const filters=[...document.querySelectorAll('.gallery-filter')];
  const more=document.getElementById('gallery-more'),LIMIT=12;
  function apply(f){
    let n=0;
    items.forEach(it=>{
      const show=f==='all'||it.dataset.group===f;
      it.hidden=!show;
      it.classList.toggle('extra',show&&++n>LIMIT);
    });
    grid.classList.add('collapsed');
    more.textContent='View all '+n+' photos';
    more.parentNode.hidden=n<=LIMIT;
  }
  filters.forEach(btn=>btn.addEventListener('click',()=>{
    filters.forEach(b=>{const on=b===btn;b.classList.toggle('active',on);b.setAttribute('aria-selected',on);});
    apply(btn.dataset.filter);
  }));
  more.addEventListener('click',()=>{grid.classList.remove('collapsed');more.parentNode.hidden=true;});
  apply('all');

  const lb=document.getElementById('lightbox'),img=document.getElementById('lb-img'),
        cap=document.getElementById('lb-caption'),cnt=document.getElementById('lb-count');
  let list=[],idx=0,lastFocus=null;
  function show(i){
    idx=(i+list.length)%list.length;
    const a=list[idx];
    img.src=a.href;img.alt=a.querySelector('img').alt;
    cap.textContent=a.dataset.caption||'';
    cnt.textContent=(idx+1)+' / '+list.length;
    [list[idx+1],list[idx-1]].forEach(n=>{if(n)(new Image()).src=n.href;});
  }
  function open(a){
    list=items.filter(it=>!it.hidden);
    lastFocus=a;lb.hidden=false;document.body.style.overflow='hidden';
    show(list.indexOf(a));
    requestAnimationFrame(()=>lb.classList.add('open'));
    document.getElementById('lb-close').focus();
  }
  function close(){
    lb.classList.remove('open');document.body.style.overflow='';
    setTimeout(()=>{lb.hidden=true;img.src='';},250);
    if(lastFocus)lastFocus.focus();
  }
  items.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();open(a);}));
  document.getElementById('lb-close').addEventListener('click',close);
  document.getElementById('lb-prev').addEventListener('click',()=>show(idx-1));
  document.getElementById('lb-next').addEventListener('click',()=>show(idx+1));
  lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('lb-figure'))close();});
  document.addEventListener('keydown',e=>{
    if(lb.hidden)return;
    if(e.key==='Escape')close();
    else if(e.key==='ArrowLeft')show(idx-1);
    else if(e.key==='ArrowRight')show(idx+1);
  });
  let sx=null;
  lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  lb.addEventListener('touchend',e=>{
    if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>50)show(dx<0?idx+1:idx-1);
  });
})();
</script>
<script>
document.querySelectorAll('.pay-btn-copy').forEach(btn=>{
  const hint=btn.querySelector('.pay-btn-hint');
  btn.addEventListener('click',async()=>{
    const text=btn.dataset.copy;
    try{await navigator.clipboard.writeText(text);}
    catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(_){}t.remove();}
    hint.textContent='Copied! Paste it into your bank’s Zelle';
    clearTimeout(btn._t);btn._t=setTimeout(()=>{hint.textContent='Tap to copy';},2500);
  });
});
</script>
<script>
(function(){
  const m=document.getElementById('fund-modal'),o=document.getElementById('fund-open');
  if(!m||!o)return;
  o.addEventListener('click',()=>m.showModal());
  document.getElementById('fund-close').addEventListener('click',()=>m.close());
  m.addEventListener('click',e=>{if(e.target===m)m.close();});
})();
</script>
